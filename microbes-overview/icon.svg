<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"
     role="img" aria-label="A magnifying glass over microbes">
  <title>Microbes &amp; Cells Atlas</title>
  <!-- Authored as vector rather than traced from a raster so it stays crisp as a
       16px favicon and as a large touch icon from the same file. -->
  <defs>
    <clipPath id="lens">
      <circle cx="27" cy="27" r="16.5"/>
    </clipPath>
  </defs>

  <!-- handle, drawn first so the lens ring overlaps it cleanly -->
  <path d="M38.6 38.6 L52.5 52.5" stroke="#46617f" stroke-width="7.5"
        stroke-linecap="round" fill="none"/>

  <!-- lens interior -->
  <circle cx="27" cy="27" r="16.5" fill="#ffffff"/>

  <g clip-path="url(#lens)" stroke-linecap="round" stroke-linejoin="round">
    <!-- purple rod with flagella, upper left -->
    <g stroke="#8b5fbf" fill="none" stroke-width="1.1">
      <path d="M17.5 24.5 q-2.5 2 -4.5 1.5 M18 26.5 q-3 2.5 -5.5 2.5 M19.5 28 q-2 3 -4.5 3.5"/>
      <path d="M14.5 19 q-1.5 1.5 -2 3 M17 17.5 q-1 -2 -2.5 -3"/>
    </g>
    <rect x="14.6" y="16.4" width="7.6" height="11.4" rx="3.8"
          fill="#c9a6e6" stroke="#8b5fbf" stroke-width="1.3"
          transform="rotate(-18 18.4 22.1)"/>
    <circle cx="17.2" cy="20.2" r="0.8" fill="#8b5fbf" opacity=".55"/>
    <circle cx="19.6" cy="24.2" r="0.7" fill="#8b5fbf" opacity=".55"/>

    <!-- green cluster (coccus raspberry), upper right -->
    <g fill="#9ed49a" stroke="#4f9a52" stroke-width="1.1">
      <circle cx="33.2" cy="17.4" r="2.5"/><circle cx="37.2" cy="16.6" r="2.5"/>
      <circle cx="35.4" cy="20.6" r="2.5"/><circle cx="39.3" cy="19.9" r="2.5"/>
      <circle cx="36.9" cy="13.6" r="2.2"/>
    </g>

    <!-- blue spirochete, sweeping across the middle -->
    <path d="M13.5 33.5 q4 -4.5 8 -1 t8 -1 q4 -4 7.5 -6.5"
          stroke="#5aa9dd" stroke-width="2.6" fill="none"/>

    <!-- small green rod with flagella, centre left -->
    <g stroke="#4f9a52" fill="none" stroke-width=".9">
      <path d="M21.5 26.6 q2.5 -1 4 -2.5 M22.5 28.6 q3 -.5 5 -1.5"/>
    </g>
    <ellipse cx="19.6" cy="27.6" rx="3.4" ry="2.3" fill="#9ed49a"
             stroke="#4f9a52" stroke-width="1.2"
             transform="rotate(-24 19.6 27.6)"/>

    <!-- yellow budding yeast, lower right -->
    <g fill="#f2dc93" stroke="#c8a83f" stroke-width="1.2">
      <ellipse cx="35.6" cy="32.4" rx="5" ry="4.4"/>
      <circle cx="40.6" cy="28.6" r="2.8"/>
    </g>
    <circle cx="35.4" cy="32.2" r="1.1" fill="#c8a83f" opacity=".5"/>

    <!-- red virus with spikes, lower left -->
    <g stroke="#cf4d4d" stroke-width="1.1">
      <path d="M25 32 v-2.4 M25 39.6 v2.4 M21.2 35.8 h-2.4 M28.8 35.8 h2.4
               M22.3 33.1 l-1.7 -1.7 M27.7 38.5 l1.7 1.7
               M27.7 33.1 l1.7 -1.7 M22.3 38.5 l-1.7 1.7"/>
    </g>
    <circle cx="25" cy="35.8" r="4.1" fill="#eb8f8f" stroke="#cf4d4d" stroke-width="1.3"/>
    <circle cx="23.6" cy="34.6" r=".8" fill="#cf4d4d" opacity=".6"/>
    <circle cx="26.4" cy="36.9" r=".7" fill="#cf4d4d" opacity=".6"/>
  </g>

  <!-- lens ring last, so it caps every clipped edge -->
  <circle cx="27" cy="27" r="16.5" fill="none" stroke="#46617f" stroke-width="4"/>
  <circle cx="27" cy="27" r="19" fill="none" stroke="#46617f" stroke-width="1.4" opacity=".35"/>
</svg>
