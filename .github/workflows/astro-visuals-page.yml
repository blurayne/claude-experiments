# Rebuilds astro-visuals/galactic-transit.html from astro-visuals/src/.
#
# The page used to BE the source: one 6,400-line file, edited in place. It is now the
# artifact — Vite bundles src/ back into exactly that one self-contained file, in place, so
# sw.js still caches it by name, build_site.py still substitutes the build stamp into it, and
# every bookmark still works. Which means the committed artifact can drift from the sources
# that produced it, and this is what stops that.
#
# It is a separate workflow from astro-visuals.yml on purpose: that one regenerates the data
# maps and is triggered by the tools that build them, and a workflow-level `paths` filter
# cannot be per-job.
#
# Per the repository convention the filter names only the sources, never the generated file,
# so the bot's own commit does not retrigger the build.
name: astro-visuals page
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - astro-visuals/src/**
      - astro-visuals/package.json
      - astro-visuals/package-lock.json
      - astro-visuals/vite.config.ts
      - astro-visuals/tsconfig.json
      - astro-visuals/scripts/**
      - .github/workflows/astro-visuals-page.yml
permissions:
  contents: write
concurrency:
  group: astro-visuals-page
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: astro-visuals
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: astro-visuals/package-lock.json
      - run: npm ci
      # The same three checks the working copy runs, in the same order. tsc and check-names
      # are cheap and catch the mistakes a bundler will not: a name left behind by an
      # extraction resolves to nothing, and main.ts carries @ts-nocheck.
      - name: Type-check, and check every name resolves
        run: npm run check
      - name: Unit tests
        run: npm test
      # check-build runs inside `npm run build`: one file, no external script or stylesheet,
      # the build-stamp placeholders intact, exactly one WebGL2 context, and the page's
      # version matching sw.js's cache name.
      - name: Build the page
        run: npm run build
      - name: Commit the rebuilt page
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add galactic-transit.html
          if git diff --cached --quiet; then
            echo 'galactic-transit.html already matches src/; nothing to commit'
          else
            git commit -m 'astro-visuals: rebuild galactic-transit.html from src/' \
              -m 'Generated by .github/workflows/astro-visuals-page.yml. The page is the artifact; astro-visuals/src/ is the source.'
            git push origin main
          fi
